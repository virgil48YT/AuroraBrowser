name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Mention shortcuts, menus or settings if relevant.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security impact
      description: Does it send data anywhere, store anything on disk, or change incognito behaviour?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
