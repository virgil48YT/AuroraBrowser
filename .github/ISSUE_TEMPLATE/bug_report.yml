name: Bug report
description: Something in Aurora does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security vulnerabilities must not be reported here** — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Aurora version
      description: Settings > About, or the release file name.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux (AppImage)
        - Linux (tar.gz)
        - Android
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "Windows 11 23H2 / macOS 15.1 / Ubuntu 24.04 / Android 14"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: Run with AURORA_LOG_LEVEL=debug (Windows - add --shell). Remove anything private (URLs you do not want to share).
      render: text
