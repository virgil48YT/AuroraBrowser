# Guard against commits attributed to automation identities that were used by
# mistake in this repository's history (bot accounts and agent placeholder
# emails). Every commit reachable from the pushed ref / PR head is checked
# for both author and committer. Contributions from real people under their
# own identities are unaffected.
name: Commit identity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject bot / placeholder identities
        run: |
          BLOCKED='aurora-bot|AgentMedia1942|@perplexity\.(ai|local)|Perplexity (Agent|Computer)'
          bad="$(git log --format='%H %an <%ae> | %cn <%ce>' HEAD | grep -E "$BLOCKED" || true)"
          if [ -n "$bad" ]; then
            echo "::error::Commits with a blocked identity (author or committer):"
            echo "$bad"
            exit 1
          fi
          echo "All $(git rev-list --count HEAD) commits use allowed identities."
