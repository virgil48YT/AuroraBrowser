name: Android APK

on:
  push:
    branches: [main, "mobile/android"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          fi
          echo "Using SDK at $SDK, sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$SDK" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Stamp a monotonic version code
        # Epoch seconds keep versionCode strictly increasing across every
        # workflow that ships an APK (this one and release.yml), so a newer
        # build always updates an older install instead of failing with
        # "App not installed" (INSTALL_FAILED_VERSION_DOWNGRADE).
        run: echo "AURORA_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No Android signing keystore configured; the release APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aurora-release.jks"
          echo "AURORA_ANDROID_KEYSTORE=$RUNNER_TEMP/aurora-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # The release APK is built on every run so R8/resource shrinking is
      # exercised continuously. With signing secrets the output is a signed
      # app-release.apk that is published to the rolling "android-ci"
      # pre-release as a directly installable .apk; without them it is
      # app-release-unsigned.apk (not installable until signed); see
      # android/README.md#release-signing.
      - name: Build release APK
        env:
          AURORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AURORA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AURORA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APKs exist
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -la {} \;
          test -n "$(find app/build/outputs/apk/debug -name '*.apk')"
          test -n "$(find app/build/outputs/apk/release -name '*.apk')"

      - name: Verify release APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::warning::Release APK is UNSIGNED (no signing secrets) - not installable on a device."
            exit 0
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -n1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | head -n8

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # GitHub Actions artifacts always download as .zip, which Android cannot
      # install directly (it shows up as an instant "App not installed").
      # Publish the signed APK to a rolling pre-release instead so it is
      # downloadable as a plain .apk that installs with one tap.
      - name: Publish installable .apk to the android-ci release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Release APK is unsigned (no signing secrets); skipping the installable .apk upload."
            exit 0
          fi
          gh release view android-ci -R "$GITHUB_REPOSITORY" || \
            gh release create android-ci -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Android CI build (latest)" \
              --notes "Latest automatic Android build from the \`mobile/android\` branch. \`Aurora-android-latest.apk\` is replaced on every successful CI run and is signed with the Aurora release key."
          cp "$APK" Aurora-android-latest.apk
          gh release upload android-ci Aurora-android-latest.apk --clobber -R "$GITHUB_REPOSITORY"
