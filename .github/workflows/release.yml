# Build release packages for all four platforms and attach them to a DRAFT
# GitHub release when a `v*` tag is pushed (e.g. `git tag v0.2.0 && git push
# origin v0.2.0`). Nothing is published automatically: review the draft, then
# press "Publish release" on GitHub. Manual runs (workflow_dispatch) build and
# upload the same packages as workflow artifacts without creating a release.
#
#   Windows  aurora_setup.exe (CEF + single-exe SFX, build-ID verified)
#   Linux    Aurora-VERSION-linux-x86_64.AppImage / .tar.gz
#   macOS    Aurora-VERSION-macos-arm64.dmg
#   Android  aurora-VERSION.apk (signed only when signing secrets exist)
#
# Optional signing secrets (packages are still produced without them):
#   macOS:   MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD,
#            MACOS_SIGN_IDENTITY, and for notarization APPLE_ID,
#            APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#            ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Windows: none wired yet (Authenticode signing is a separate step).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

  windows:
    name: Windows (CEF + SFX)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch CEF (Windows)
        run: bash scripts/fetch_cef.sh
        env:
          PLATFORM: windows64

      - name: Configure with CEF
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DAURORA_BUILD_TESTS=ON -DAURORA_ENABLE_CEF=ON -DAURORA_BUILD_APP=ON
          -DCEF_ROOT=${{ github.workspace }}/third_party/cef
          -DCEF_RUNTIME_LIBRARY_FLAG=/MD

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ./build/bin/aurora_tests.exe

      - name: Package (windeployqt + CEF resources)
        run: |
          mkdir -p package
          cp build/bin/aurora_browser.exe package/
          cp build/bin/aurora_bootstrap.exe package/
          windeployqt --release --no-translations --no-system-d3d-compiler \
                     --no-opengl-sw package/aurora_browser.exe
          cp -r third_party/cef/Resources/* package/ 2>/dev/null || true
          cp -r third_party/cef/Release/* package/ 2>/dev/null || true
          rm -f package/*.lib package/*.exp package/*.pdb
        shell: bash

      - name: Stamp and verify the build ID
        run: |
          ./build/bin/aurora_buildid.exe generate \
              --root package \
              --cef-root third_party/cef \
              --platform windows64 \
              --out package/aurora_build.manifest
          ./build/bin/aurora_buildid.exe show --manifest package/aurora_build.manifest
          ./build/bin/aurora_buildid.exe verify --manifest package/aurora_build.manifest \
              --root package --full
        shell: bash

      - name: Build the single-exe SFX installer
        run: |
          mkdir -p dist
          bash packaging/windows/build_sfx.sh package dist/aurora_setup.exe \
              assets/icons/aurora.ico
          test -s dist/aurora_setup.exe
          V="${{ needs.version.outputs.version }}"
          cp dist/aurora_setup.exe "dist/Aurora-${V}-windows-x64-setup.exe"
          rm dist/aurora_setup.exe
          ( cd dist && sha256sum "Aurora-${V}-windows-x64-setup.exe" > "Aurora-${V}-windows-x64-setup.exe.sha256" )
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (AppImage + tarball)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libsqlite3-dev libx11-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libfuse2 patchelf \
            xvfb xauth libnss3 libatk-bridge2.0-0 libgbm1 libxcomposite1 \
            libxdamage1 libxrandr2 libasound2 libcups2 libpango-1.0-0 \
            libxshmfence1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-image0

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch CEF (Linux)
        run: bash scripts/fetch_cef.sh
        env:
          PLATFORM: linux64

      - name: Configure, build, test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAURORA_BUILD_TESTS=ON -DAURORA_ENABLE_CEF=ON -DAURORA_BUILD_APP=ON \
            -DCEF_ROOT="$GITHUB_WORKSPACE/third_party/cef"
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          QMAKE="$(command -v qmake6 || command -v qmake)" \
            bash packaging/linux/package_linux.sh build third_party/cef dist \
            "${{ needs.version.outputs.version }}"

      - name: Smoke test the AppImage (Xvfb)
        run: |
          HOME="$RUNNER_TEMP/smoke-home" AURORA_GPU=software \
            timeout 180 xvfb-run -a dist/*.AppImage --smoke-test 2>&1 | tee smoke.log
          grep -q "internal pages and tab strip exercised" smoke.log

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  macos:
    name: macOS (DMG, arm64)
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Install Ninja
        run: brew install ninja

      - name: Fetch CEF (macOS arm64)
        run: bash scripts/fetch_cef.sh
        env:
          PLATFORM: macosarm64

      - name: Configure, build, test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAURORA_BUILD_TESTS=ON -DAURORA_ENABLE_CEF=ON -DAURORA_BUILD_APP=ON \
            -DCEF_ROOT="$GITHUB_WORKSPACE/third_party/cef"
          cmake --build build
          ctest --test-dir build --output-on-failure

      # Imports a Developer ID certificate into a throwaway keychain when the
      # secrets exist; otherwise the DMG is ad-hoc signed and not notarized.
      - name: Import signing certificate (optional)
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "No macOS signing certificate configured; using ad-hoc signing."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/aurora-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bash packaging/macos/package_macos.sh build/bin/Aurora.app dist \
            "${{ needs.version.outputs.version }}" arm64

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  android:
    name: Android (APK)
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$SDK" > local.properties
          chmod +x ./gradlew

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No Android signing keystore configured; the release APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aurora-release.jks"
          echo "AURORA_ANDROID_KEYSTORE=$RUNNER_TEMP/aurora-release.jks" >> "$GITHUB_ENV"

      - name: Test and build release APK
        env:
          AURORA_VERSION_NAME: ${{ needs.version.outputs.version }}
          AURORA_VERSION_CODE: ${{ github.run_number }}
          AURORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AURORA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AURORA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace
          V="${{ needs.version.outputs.version }}"
          mkdir -p ../dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "../dist/Aurora-${V}-android.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "../dist/Aurora-${V}-android-unsigned.apk"
          fi
          ( cd ../dist && sha256sum *.apk > "Aurora-${V}-android.sha256" )
          rm -f "$RUNNER_TEMP/aurora-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [version, windows, linux, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Create draft release with all packages
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Aurora ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
