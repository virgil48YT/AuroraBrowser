# Verify the core library and tests on Linux. This is the same build that
# runs in the headless development sandbox: core + tests, no Qt, no CEF.
name: Linux core + tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libsqlite3-dev g++
      # Aurora Shields: the Rust ad-block engine (brave/adblock-rust) is built
      # from third_party/adblock. Without a toolchain the build still succeeds
      # against the inert stub, but CI should exercise the real engine.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAURORA_BUILD_TESTS=ON -DAURORA_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
